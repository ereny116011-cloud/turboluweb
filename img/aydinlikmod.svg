<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Açık tema için Big Sur tarzı manzara">
  <defs>
    <!-- Gökyüzü: gece laciverti, sağ üstte mora kayar -->
    <linearGradient id="sky" x1="0.05" y1="0" x2="0.75" y2="1">
      <stop offset="0"    stop-color="#eaf0fd"/>
      <stop offset="0.32" stop-color="#f0edfc"/>
      <stop offset="0.62" stop-color="#f7eefb"/>
      <stop offset="1"    stop-color="#fceff8"/>
    </linearGradient>

    <!-- Her kumul: tepesi aydınlık, dibi karanlığa gömülü.
         Dikey degrade sayesinde katmanlara hacim ve derinlik geliyor. -->
    <linearGradient id="d1" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0"    stop-color="#5b4bc4"/>
      <stop offset="0.35" stop-color="#332a86"/>
      <stop offset="1"    stop-color="#141146"/>
    </linearGradient>

    <linearGradient id="d2" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0"    stop-color="#8a4ad8"/>
      <stop offset="0.34" stop-color="#4e2795"/>
      <stop offset="1"    stop-color="#1d1358"/>
    </linearGradient>

    <linearGradient id="d3" x1="0" y1="0" x2="0.18" y2="1">
      <stop offset="0"    stop-color="#c04ad2"/>
      <stop offset="0.33" stop-color="#7a2799"/>
      <stop offset="1"    stop-color="#2c1359"/>
    </linearGradient>

    <linearGradient id="d4" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0"    stop-color="#f1549e"/>
      <stop offset="0.32" stop-color="#a72a72"/>
      <stop offset="1"    stop-color="#3c1250"/>
    </linearGradient>

    <linearGradient id="d5" x1="0" y1="0" x2="0.22" y2="1">
      <stop offset="0"    stop-color="#ff6f6a"/>
      <stop offset="0.32" stop-color="#cf3347"/>
      <stop offset="1"    stop-color="#54133c"/>
    </linearGradient>

    <linearGradient id="d6" x1="0" y1="0" x2="0.24" y2="1">
      <stop offset="0"    stop-color="#ff9a45"/>
      <stop offset="0.34" stop-color="#e75c22"/>
      <stop offset="1"    stop-color="#6c1c1c"/>
    </linearGradient>

    <linearGradient id="d7" x1="0" y1="0" x2="0.26" y2="1">
      <stop offset="0"    stop-color="#ffd166"/>
      <stop offset="0.36" stop-color="#f59b24"/>
      <stop offset="1"    stop-color="#8a3512"/>
    </linearGradient>

    <linearGradient id="d8" x1="0" y1="0" x2="0.28" y2="1">
      <stop offset="0"    stop-color="#fff0b0"/>
      <stop offset="0.4"  stop-color="#ffc247"/>
      <stop offset="1"    stop-color="#b8580f"/>
    </linearGradient>

    <!-- Tepedeki ışık patlaması -->
    <radialGradient id="patlama" cx="0.4" cy="0.42" r="0.46">
      <stop offset="0"    stop-color="#ffe4ff" stop-opacity="0.62"/>
      <stop offset="0.4"  stop-color="#b478ff" stop-opacity="0.24"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Yukarıdan gelen serin gölge -->
    <linearGradient id="ustGolge" x1="0" y1="0" x2="0" y2="0.5">
      <stop offset="0" stop-color="#050a1c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#050a1c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Gökyüzü + tepe ışığı -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#patlama)"/>

  <!-- Kumul katmanları: iç içe, hafif döndürülmüş elipsler.
       Her birinin kenarında ince bir ışık çizgisi var; alttaki katman
       üsttekinin gövdesini örtünce geriye sadece aydınlanmış tepe kalıyor. -->
  <g stroke-linejoin="round">
    <ellipse cx="745" cy="1585" rx="1370" ry="1345" transform="rotate(-3.5 745 1585)"
             fill="url(#d1)" stroke="rgba(168,150,255,0.42)" stroke-width="3"/>
    <ellipse cx="905" cy="1585" rx="1265" ry="1240" transform="rotate(-2 905 1585)"
             fill="url(#d2)" stroke="rgba(198,150,255,0.40)" stroke-width="3"/>
    <ellipse cx="1020" cy="1600" rx="1150" ry="1112" transform="rotate(1.5 1020 1600)"
             fill="url(#d3)" stroke="rgba(255,150,240,0.40)" stroke-width="3"/>
    <ellipse cx="820" cy="1645" rx="1045" ry="988" transform="rotate(-1.5 820 1645)"
             fill="url(#d4)" stroke="rgba(255,160,215,0.42)" stroke-width="3"/>
    <ellipse cx="1095" cy="1615" rx="905" ry="812" transform="rotate(2.5 1095 1615)"
             fill="url(#d5)" stroke="rgba(255,175,175,0.42)" stroke-width="3"/>
    <ellipse cx="850" cy="1665" rx="790" ry="678" transform="rotate(-1 850 1665)"
             fill="url(#d6)" stroke="rgba(255,205,150,0.44)" stroke-width="3"/>
    <ellipse cx="1035" cy="1700" rx="705" ry="596" transform="rotate(1.5 1035 1700)"
             fill="url(#d7)" stroke="rgba(255,232,180,0.46)" stroke-width="3"/>
    <ellipse cx="855" cy="1760" rx="640" ry="540" transform="rotate(-1 855 1760)"
             fill="url(#d8)" stroke="rgba(255,250,220,0.42)" stroke-width="3"/>
  </g>
</svg>
