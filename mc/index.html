<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TurboluMC - Java Edition Minecraft Sunucusu</title>
    <meta name="description" content="TurboluMC, Java Edition Minecraft sunucumuz. Kesintisiz macera, harika topluluk ve eğlence dolu anlar.">
    
    <link rel="canonical" href="https://turboluweb.wasmer.app/mc/">
    
    <meta property="og:site_name" content="Turbolu Studios">
    <meta property="og:title" content="TurboluMC - Java Edition Minecraft Sunucusu">
    <meta property="og:description" content="Kesintisiz macera, harika topluluk ve eğlence dolu anlar.">
    <meta property="og:url" content="https://turboluweb.wasmer.app/mc/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://turboluweb.wasmer.app/mc/crpr.webp">
    
    <link rel="icon" href="crpr.webp" type="image/webp">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="preload" as="image" href="crpr.webp">
    
    <link rel="stylesheet" href="../fa/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/mc/manifest.json">
    <meta name="theme-color" content="#22c55e">
    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
            const isLight = saved ? saved === 'light' : prefersLight;
            if (isLight) document.documentElement.classList.add('light');
        })();
    </script>
</head>
<body>
    <canvas id="bgSteamCanvas" class="bg-steam-canvas"></canvas>
    <div class="steam-container">
        <div class="steam-blob blob-1"></div>
        <div class="steam-blob blob-2"></div>
        <div class="steam-blob blob-3"></div>
        <div class="steam-blob blob-4"></div>
    </div>

    <div id="app">
        <nav class="navbar">
            <div class="nav-left">
                <button class="back-btn" onclick="window.location.href='/'">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div class="logo" onclick="showContent('status')">
                    <img src="crpr.webp" alt="TurboluMC" class="logo-img" width="32" height="32" loading="eager" fetchpriority="high" decoding="async">
                    TurboluMC
                </div>
            </div>
            <div class="nav-links" id="navLinks"></div>
            <div class="user-area" id="userArea"></div>
        </nav>
        <main id="content"></main>
        <div id="modal" class="modal hidden">
            <div class="modal-content" id="modalBody"></div>
        </div>
    </div>

    <button id="themeToggle" class="theme-toggle" title="Tema Değiştir" onclick="toggleTheme()">
        <i class="fa-solid fa-moon"></i>
    </button>

    <canvas id="steamCanvas" class="steam-canvas"></canvas>

    <script src="app.js"></script>
</body>
</html>
