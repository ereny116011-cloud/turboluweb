<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TurboluMC - Resmi Web Sitesi</title>
    <link rel="icon" href="crpr.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="/mc/manifest.json">
    <meta name="theme-color" content="#22c55e">
</head>
<body class="main-view">
    <!-- Arka plan katmanları -->
    <canvas id="dotGridCanvas" class="bg-canvas"></canvas>
    <canvas id="steamCanvas" class="steam-canvas"></canvas>
    <div class="steam-container">
        <div class="steam-blob blob-1"></div>
        <div class="steam-blob blob-2"></div>
        <div class="steam-blob blob-3"></div>
        <div class="steam-blob blob-4"></div>
        <div class="steam-blob blob-5"></div>
        <div class="steam-blob blob-6"></div>
    </div>
    <div class="bg-image" id="bgImage"></div>

    <div id="app">
        <nav class="navbar">
            <div class="nav-left">
                <button class="back-btn" onclick="window.location.href='/'" title="Ana Sayfa">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div class="logo" onclick="showContent('status')">
                    <img src="crpr.png" alt="TurboluMC" class="logo-img">
                    TurboluMC
                </div>
            </div>
            <div class="nav-links" id="navLinks"></div>
            <div class="user-area" id="userArea"></div>
        </nav>
        <main id="content"></main>
        <div id="modal" class="modal hidden">
            <div class="modal-content" id="modalBody"></div>
        </div>
    </div>

    <button id="themeToggle" class="theme-toggle" title="Tema Değiştir" onclick="toggleTheme()">
        <i class="fa-solid fa-moon"></i>
    </button>

    <script src="app.js"></script>
</body>
</html>
