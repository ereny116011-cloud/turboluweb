<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TurboluMC - Resmi Web Sitesi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="/mc/manifest.json">
    <meta name="theme-color" content="#22c55e">
</head>
<body>
    <div class="bg-image"></div>
    <div id="app">
        <nav class="navbar">
            <div class="logo" onclick="window.location.href='/'">
                <svg width="30" height="30" viewBox="0 0 8 8" shape-rendering="crispEdges">
                    <rect width="8" height="8" fill="#22c55e" />
                    <rect x="1" y="2" width="2" height="2" fill="#000000" />
                    <rect x="5" y="2" width="2" height="2" fill="#000000" />
                    <rect x="2" y="4" width="4" height="1" fill="#000000" />
                    <rect x="2" y="5" width="4" height="1" fill="#000000" />
                    <rect x="1" y="6" width="6" height="1" fill="#000000" />
                    <rect x="0" y="7" width="8" height="1" fill="#000000" />
                </svg>
                TurboluMC
            </div>
            <div class="user-area" id="userArea"></div>
            <button class="home-btn" onclick="window.location.href='/'">
                <i class="fa-solid fa-house"></i> Ana Sayfa
            </button>
        </nav>
        <main id="content"></main>
        <div id="modal" class="modal hidden">
            <div class="modal-content" id="modalBody"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
