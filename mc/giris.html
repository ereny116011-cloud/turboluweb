<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş - TurboluMC</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="crpr.png" type="image/png">
    <link rel="stylesheet" href="style.css?v=5">
    <link rel="stylesheet" href="../site-polish.css?v=12">
</head>
<body>
    <div class="bg-image"></div>
    <div id="userArea" hidden></div>
    <main class="glass-card" style="width:min(92vw,400px); margin:clamp(24px,8vh,100px) auto; padding:clamp(20px,5vw,2rem);">
        <h2 style="text-align:center;">Giriş Yap</h2>
        <form id="loginForm" novalidate>
            <input id="username" name="username" placeholder="Kullanıcı adı" autocomplete="username"
                   maxlength="20" autocapitalize="none" autocorrect="off" spellcheck="false" required>
            <input id="password" name="password" type="password" placeholder="Parola" autocomplete="current-password" required>
            <p id="formError" class="auth-error" role="alert" aria-live="polite"></p>
            <button class="btn-green" id="loginBtn" type="submit" style="width:100%;">Giriş Yap</button>
        </form>
        <div data-oauth-mount></div>
        <p style="text-align:center; margin-top:10px;"><a href="../kayit.html">Kaydol</a> | <a href="../sifremi-unuttum.html">Şifremi unuttum</a></p>
    </main>
    <script>
        (function () {
            const API = 'https://shrill-salad-a498.ereny116011.workers.dev';
            const form = document.getElementById('loginForm');
            const error = document.getElementById('formError');
            const btn = document.getElementById('loginBtn');
            let busy = false;

            form.addEventListener('submit', async function (event) {
                event.preventDefault();
                if (busy) return;

                const username = document.getElementById('username').value.trim().replace(/\s+/g, ' ');
                const password = document.getElementById('password').value;

                error.textContent = '';
                if (!username) { error.textContent = 'Kullanıcı adı gerekli.'; return; }
                if (!password) { error.textContent = 'Parola gerekli.'; return; }

                busy = true;
                btn.disabled = true;
                btn.textContent = 'Giriş yapılıyor…';
                try {
                    const res = await fetch(API + '/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json().catch(function () { return {}; });
                    if (!res.ok || data.error) {
                        error.textContent = data.error || 'Giriş yapılamadı. Lütfen tekrar dene.';
                        return;
                    }
                    localStorage.setItem('token', data.token);
                    window.location.href = 'index.html';
                } catch (_) {
                    error.textContent = 'Sunucuya ulaşılamadı. İnternet bağlantını kontrol et.';
                } finally {
                    busy = false;
                    btn.disabled = false;
                    btn.textContent = 'Giriş Yap';
                }
            });
        })();
    </script>
    <script src="/site-account.js?v=7"></script>
</body>
</html>
