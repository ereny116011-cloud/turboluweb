<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Sıfırla - TurboluMC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-image"></div>
    <div class="glass-card" style="max-width:400px; margin:100px auto; padding:2rem;">
        <h2 style="text-align:center; color: var(--accent);">Yeni Parola Belirle</h2>
        <p style="text-align:center; margin-bottom:1rem;">Yeni şifrenizi girin</p>
        <input id="newPassword" type="password" placeholder="Yeni parola"><br>
        <input id="confirmPassword" type="password" placeholder="Yeni parola (tekrar)"><br>
        <button id="resetBtn" class="btn-green" style="width:100%;">Şifreyi Güncelle</button>
    </div>

    <script>
        const token = new URLSearchParams(window.location.search).get('token');
        if (!token) alert('Geçersiz bağlantı');

        document.getElementById('resetBtn').addEventListener('click', async () => {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (newPassword !== confirmPassword) return alert('Parolalar uyuşmuyor');
            if (newPassword.length < 6) return alert('Parola en az 6 karakter olmalı');

            const res = await fetch('https://shrill-salad-a498.ereny116011.workers.dev/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, newPassword })
            });
            const data = await res.json();
            if (data.success) {
                alert('Şifre başarıyla sıfırlandı. Giriş yapabilirsiniz.');
                window.location.href = 'index.html';
            } else {
                alert(data.error || 'Bir hata oluştu');
            }
        });
    </script>
</body>
</html>
