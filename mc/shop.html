<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - TurboluMC</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="stylesheet" href="style.css?v=5">
    <link rel="stylesheet" href="../site-polish.css?v=12">
</head>
<body>
  <div id="app">
    <header>
      <h1><i class="fa-solid fa-cart-shopping"></i> Shop</h1>
      <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Ana Sayfa</a>
    </header>
    <div class="card">
      <p>Bakiye: <span id="balance">0</span></p>
      <div id="items">Yükleniyor...</div>
    </div>
  </div>
  <script>
    (function () {
      'use strict';

      var API = 'https://shrill-salad-a498.ereny116011.workers.dev';

      function esc(v) {
        return v == null ? '' : String(v)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      // onclick="fn('...')" içine gömülen değerler için güvenli karakter seti
      function safeId(v) {
        return String(v == null ? '' : v).replace(/[^a-zA-Z0-9_-]/g, '');
      }

      function token() {
        try { return localStorage.getItem('token'); } catch (e) { return null; }
      }

      async function loadItems() {
        var kap = document.getElementById('items');
        try {
          var res = await fetch(API + '/api/items');
          if (!res.ok) throw new Error('HTTP ' + res.status);
          var items = await res.json();
          if (!Array.isArray(items)) items = [];
          kap.innerHTML = items.length === 0 ? '<p>Henüz ürün yok.</p>' : items.map(function (i) {
            return '<div class="card" style="margin:10px 0">' +
              '<b>' + esc(i.name) + '</b> - ' + esc(i.price) + ' puan ' +
              '<button data-id="' + esc(safeId(i.id)) + '" class="satin-al">Satın Al</button>' +
              '</div>';
          }).join('');
        } catch (e) {
          kap.innerHTML = '<p>Ürünler yüklenemedi. Daha sonra tekrar dene.</p>';
        }
      }

      async function buyItem(itemId) {
        if (!token()) { alert('Önce giriş yap!'); window.location.href = 'giris.html'; return; }
        var res = await fetch(API + '/api/buy', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token(), 'Content-Type': 'application/json' },
          body: JSON.stringify({ itemId: itemId })
        });
        var data = await res.json();
        if (data.error) return alert(data.error);
        alert('Satın alındı!');
        loadItems();
      }

      document.getElementById('items').addEventListener('click', function (e) {
        var btn = e.target.closest('.satin-al');
        if (btn) buyItem(btn.dataset.id);
      });

      var bakiye = document.getElementById('balance');
      try {
        var user = JSON.parse(localStorage.getItem('user') || 'null');
        if (user && typeof user.balance !== 'undefined') bakiye.textContent = String(user.balance);
      } catch (e) { /* yok say */ }

      loadItems();
    })();
  </script>
    <script src="/site-account.js?v=9"></script>
</body>
</html>
