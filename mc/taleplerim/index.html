<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Taleplerim - TurboluMC</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="../crpr.png" type="image/png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../../fa/css/fontawesome.min.css">
    <link rel="stylesheet" href="../../fa/css/solid.min.css">
</head>
<body>
    <div class="bg-image"></div>
    <div id="app">
        <nav class="navbar">
            <div class="logo" onclick="window.location.href='/'"><img src="../crpr.png" class="logo-img"> TurboluMC</div>
            <div class="nav-links">
                <a href="../market"><i class="fa-solid fa-cart-shopping"></i> Market</a>
                <a href="../taleplerim"><i class="fa-solid fa-box"></i> Taleplerim</a>
                <a href="../kampanyalar"><i class="fa-solid fa-tags"></i> Kampanyalar</a>
                <a href="../duyurular"><i class="fa-solid fa-bullhorn"></i> Duyurular</a>
                <a href="../haberler"><i class="fa-solid fa-newspaper"></i> Haberler</a>
            </div>
            <div class="user-area" id="userArea"></div>
        </nav>
        <main class="glass-card" style="max-width:700px; margin:2rem auto;">
            <h2><i class="fa-solid fa-box"></i> Taleplerim</h2>
            <div id="requests">Yükleniyor...</div>
        </main>
    </div>
    <script src="../app.js"></script>
    <script>
        async function loadRequests() {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href='../giris.html'; return; }
            const res = await fetch('https://shrill-salad-a498.ereny116011.workers.dev/api/inventory', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const reqs = await res.json();
            document.getElementById('requests').innerHTML = reqs.length === 0 ? '<p>Henüz talebiniz yok.</p>' : reqs.map(r => `
                <div style="padding:10px; background:rgba(0,0,0,0.3); border-radius:8px; margin:5px 0; display:flex; justify-content:space-between;">
                    <div><b>${r.item}</b> (${r.price} puan)<br><small>${new Date(r.date).toLocaleString()}</small></div>
                    <span style="padding:4px 12px; border-radius:20px; font-size:0.85rem; background:${r.status==='completed'?'#22c55e':r.status==='rejected'?'#ef4444':'#eab308'}">${r.status}</span>
                </div>
            `).join('');
        }
        loadRequests();
    </script>
</body>
</html>
