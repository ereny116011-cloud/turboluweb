<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Market - TurboluMC</title>
    <link rel="icon" href="../crpr.png" type="image/png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-image"></div>
    <div id="app">
        <nav class="navbar">
            <div class="logo" onclick="window.location.href='/'">TurboluMC</div>
            <div class="nav-links">
                <a href="../market">🛒 Market</a>
                <a href="../taleplerim">📦 Taleplerim</a>
                <a href="../kampanyalar">📣 Kampanyalar</a>
                <a href="../duyurular">📢 Duyurular</a>
                <a href="../haberler">📰 Haberler</a>
            </div>
            <div class="user-area" id="userArea"></div>
        </nav>
        <main id="content">
            <div class="glass-card">
                <h2>🛒 Market</h2>
                <p id="loading">Yükleniyor...</p>
                <div id="items"></div>
            </div>
        </main>
    </div>
    <script src="../app.js"></script>
    <script>
        async function loadItems() {
            const res = await fetch('https://shrill-salad-a498.ereny116011.workers.dev/api/items');
            const items = await res.json();
            const container = document.getElementById('items');
            document.getElementById('loading').style.display = 'none';
            if (items.length === 0) {
                container.innerHTML = '<p>Henüz ürün eklenmemiş.</p>';
                return;
            }
            container.innerHTML = items.map(i => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; background:rgba(0,0,0,0.3); border-radius:8px; margin:8px 0;">
                    <div>
                        <b>${i.name}</b>
                        <p style="font-size:0.85rem; opacity:0.7;">${i.price} puan</p>
                    </div>
                    <button onclick="buy('${i.id}')">Satın Al</button>
                </div>
            `).join('');
        }
        async function buy(itemId) {
            const token = localStorage.getItem('token');
            if (!token) { alert('Lütfen önce giriş yapın.'); window.location.href='../login.html'; return; }
            const res = await fetch('https://shrill-salad-a498.ereny116011.workers.dev/api/buy', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ itemId })
            });
            const data = await res.json();
            if (data.error) alert(data.error);
            else { alert('✅ Talep alındı!'); loadItems(); }
        }
        loadItems();
    </script>
</body>
</html>
