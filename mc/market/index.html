<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Market - TurboluMC</title>
    <link rel="icon" href="../crpr.png" type="image/png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../../fa/css/fontawesome.min.css">
    <link rel="stylesheet" href="../../fa/css/solid.min.css">
</head>
<body>
    <div class="bg-image"></div>
    <div id="app">
        <nav class="navbar">
            <div class="logo" onclick="window.location.href='/'"><img src="../crpr.png" class="logo-img"> TurboluMC</div>
            <div class="nav-links">
                <a href="../market"><i class="fa-solid fa-cart-shopping"></i> Market</a>
                <a href="../taleplerim"><i class="fa-solid fa-box"></i> Taleplerim</a>
                <a href="../kampanyalar"><i class="fa-solid fa-tags"></i> Kampanyalar</a>
                <a href="../duyurular"><i class="fa-solid fa-bullhorn"></i> Duyurular</a>
                <a href="../haberler"><i class="fa-solid fa-newspaper"></i> Haberler</a>
            </div>
            <div class="user-area" id="userArea"></div>
        </nav>
        <main class="glass-card" style="max-width:700px; margin:2rem auto;">
            <h2><i class="fa-solid fa-cart-shopping"></i> Market</h2>
            <div id="items">Yükleniyor...</div>
        </main>
    </div>
    <script src="../app.js"></script>
    <script>
        // API'den gelen metni HTML'e güvenle basmak için (XSS koruması)
        function escHtml(v) {
            return v == null ? '' : String(v)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        async function loadItems() {
            const res = await fetch('https://shrill-salad-a498.ereny116011.workers.dev/api/items');
            const items = await res.json();
            document.getElementById('items').innerHTML = items.length === 0 ? '<p>Henüz ürün yok.</p>' : items.map(i => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; background:rgba(0,0,0,0.3); border-radius:8px; margin:8px 0;">
                    <div><b>${escHtml(i.name)}</b><br><small>${escHtml(i.price)} puan</small></div>
                    <button onclick="buy('${i.id}')">Satın Al</button>
                </div>
            `).join('');
        }
        async function buy(itemId) {
            const token = localStorage.getItem('token');
            if (!token) { alert('Önce giriş yapın'); window.location.href='../giris.html'; return; }
            const res = await fetch('https://shrill-salad-a498.ereny116011.workers.dev/api/buy', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ itemId })
            });
            const data = await res.json();
            alert(data.message || data.error || '<i class="fa-solid fa-circle-check"></i> Talep alındı');
            loadItems();
        }
        loadItems();
    </script>
</body>
</html>
