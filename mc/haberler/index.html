<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Haberler - TurboluMC</title>
    <link rel="icon" href="../crpr.png" type="image/png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../../fa/css/fontawesome.min.css">
    <link rel="stylesheet" href="../../fa/css/solid.min.css">
</head>
<body>
    <div class="bg-image"></div>
    <div id="app">
        <nav class="navbar">
            <div class="logo" onclick="window.location.href='/'"><img src="../crpr.png" class="logo-img"> TurboluMC</div>
            <div class="nav-links">
                <a href="../market">🛒 Market</a>
                <a href="../taleplerim">📦 Taleplerim</a>
                <a href="../kampanyalar">📣 Kampanyalar</a>
                <a href="../duyurular">📢 Duyurular</a>
                <a href="../haberler">📰 Haberler</a>
            </div>
            <div class="user-area" id="userArea"></div>
        </nav>
        <main class="glass-card" style="max-width:700px; margin:2rem auto;">
            <h2>📰 Haberler</h2>
            <div id="news">Yükleniyor...</div>
        </main>
    </div>
    <script src="../app.js"></script>
    <script>
        // API'den gelen metni HTML'e güvenle basmak için (XSS koruması)
        function escHtml(v) {
            return v == null ? '' : String(v)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        async function loadNews() {
            const res = await fetch('https://shrill-salad-a498.ereny116011.workers.dev/api/news');
            const news = await res.json();
            document.getElementById('news').innerHTML = news.length === 0 ? '<p>Henüz haber yok.</p>' : news.map(n => `
                <div class="news-item"><h3>${escHtml(n.title)}</h3><p>${escHtml(n.content)}</p><small>${new Date(n.date).toLocaleString()}</small></div>
            `).join('');
        }
        loadNews();
    </script>
</body>
</html>
