name: TurboluApp PC derleme

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            command: dist:win
            artifact: turboluapp-windows
          - name: Linux
            os: ubuntu-latest
            command: dist:linux
            artifact: turboluapp-linux
          - name: macOS Intel
            os: macos-15-intel
            command: dist:mac -- --x64
            artifact: turboluapp-macos-x64
          - name: macOS Apple Silicon
            os: macos-15
            command: dist:mac -- --arm64
            artifact: turboluapp-macos-arm64

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Derle
        run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Çıktıları listele
        shell: bash
        run: ls -lh dist

      - name: Çıktıları yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.yml
          if-no-files-found: error
          retention-days: 30
