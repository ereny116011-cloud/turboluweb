name: TurboluApp PC derleme

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win
            artifact: turboluapp-windows
          - name: Linux
            os: ubuntu-latest
            args: --linux
            artifact: turboluapp-linux
          - name: macOS Intel
            os: macos-15-intel
            args: --mac --x64
            artifact: turboluapp-macos-x64
          - name: macOS Apple Silicon
            os: macos-15
            args: --mac --arm64
            artifact: turboluapp-macos-arm64

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Derle (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Derle (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never

      - name: Derle (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Sağlama toplamı oluştur
        run: node scripts/checksums.mjs dist

      - name: Çıktıları listele
        shell: bash
        run: ls -lh dist

      - name: Çıktıları yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/SHA256SUMS.txt
            desktop/dist/*.yml
          if-no-files-found: error
          retention-days: 30
