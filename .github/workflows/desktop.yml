name: TurboluApp PC derleme

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            artifact: turboluapp-windows
          - name: Linux
            os: ubuntu-latest
            bundles: deb,appimage
            artifact: turboluapp-linux
          - name: macOS Intel
            os: macos-15-intel
            bundles: dmg
            rust_target: x86_64-apple-darwin
            target: --target x86_64-apple-darwin
            artifact: turboluapp-macos-x64
          - name: macOS Apple Silicon
            os: macos-15
            bundles: dmg
            rust_target: aarch64-apple-darwin
            target: --target aarch64-apple-darwin
            artifact: turboluapp-macos-arm64

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Rust araç zincirini kur
        uses: dtolnay/rust-toolchain@stable

      - name: Tauri CLI kur
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: latest
          build: false

      - name: Rust hedefini kur (macOS)
        if: runner.os == 'macOS'
        run: rustup target add ${{ matrix.rust_target }}

      - name: Tauri sistem bağımlılıklarını kur (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            file \
            wget \
            fuse3

      - name: Önbellek
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ matrix.name }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.name }}-cargo-

      - name: Sertifikayı içe aktar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dosya = Join-Path $env:RUNNER_TEMP "turbolu-codesign.pfx"

          # Secret base64 olabilir (metin olarak saklanan pfx) ya da ham pfx.
          $ham = "${{ secrets.WIN_CSC_LINK }}"
          try {
            $bayt = [Convert]::FromBase64String($ham)
            [IO.File]::WriteAllBytes($dosya, $bayt)
          } catch {
            [IO.File]::WriteAllText($dosya, $ham, [Text.Encoding]::ASCII)
          }
          $sifre = "${{ secrets.WIN_CSC_KEY_PASSWORD }}"
          $sertifika = $null
          if ($sifre) {
            $parola = ConvertTo-SecureString $sifre -AsPlainText -Force
            $sertifika = Import-PfxCertificate -FilePath $dosya -CertStoreLocation Cert:\CurrentUser\My -Password $parola
          } else {
            $sertifika = Import-PfxCertificate -FilePath $dosya -CertStoreLocation Cert:\CurrentUser\My
          }
          Remove-Item $dosya -Force
          if (-not $sertifika) { throw "Sertifika içe aktarılamadı." }
          "thumbprint=$($sertifika.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Sertifika içe aktarıldı: $($sertifika.Thumbprint)"

      - name: Derle (Windows)
        if: runner.os == 'Windows'
        run: cargo tauri build --bundles nsis
        env:
          TAURI_BUNDLE_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ env.thumbprint }}
          TAURI_BUNDLE_WINDOWS_CERTIFICATE_TIMESTAMP_SERVER: http://timestamp.digicert.com
          TAURI_BUNDLE_WINDOWS_DIGEST_ALGORITHM: sha256

      - name: Derle (Linux)
        if: runner.os == 'Linux'
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Derle (macOS)
        if: runner.os == 'macOS'
        run: cargo tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Sağlama toplamı oluştur
        run: cargo run --release --example checksums --manifest-path src-tauri/Cargo.toml -- src-tauri/target/release/bundle

      - name: Çıktıları listele
        shell: bash
        run: ls -lh src-tauri/target/release/bundle

      - name: Çıktıları yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: GitHub Release'a yükle
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: false
