name: TurboluApp PC derleme

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            artifact: turboluapp-windows
          - name: Linux
            os: ubuntu-latest
            bundles: deb,appimage
            artifact: turboluapp-linux
          - name: macOS Intel
            os: macos-15-intel
            bundles: dmg
            target: --target x86_64-apple-darwin
            artifact: turboluapp-macos-x64
          - name: macOS Apple Silicon
            os: macos-15
            bundles: dmg
            target: --target aarch64-apple-darwin
            artifact: turboluapp-macos-arm64

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Rust araç zincirini kur
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Tauri sistem bağımlılıklarını kur (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Önbellek
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ matrix.name }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.name }}-cargo-

      - name: Derle (Windows)
        if: runner.os == 'Windows'
        run: cargo tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.WIN_CSC_LINK }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Derle (Linux)
        if: runner.os == 'Linux'
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Derle (macOS)
        if: runner.os == 'macOS'
        run: cargo tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Sağlama toplamı oluştur
        run: cargo run --release --example checksums --manifest-path src-tauri/Cargo.toml -- src-tauri/target/release/bundle

      - name: Çıktıları listele
        shell: bash
        run: ls -lh src-tauri/target/release/bundle

      - name: Çıktıları yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
