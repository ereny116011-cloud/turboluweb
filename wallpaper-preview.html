<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080b18">
  <title>Turbolu · Canlı Duvar Kâğıdı</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080b18; }
    body { position: fixed; inset: 0; }
    .wallpaper, .lightflow { position: absolute; inset: -12%; width: 124%; height: 124%; }
    .wallpaper {
      background: url('/img/bigsur-wallpaper.webp') center / cover no-repeat;
      filter: saturate(1.45) contrast(1.06);
      animation: drift 6s ease-in-out infinite;
      will-change: transform;
    }
    .lightflow {
      opacity: .72;
      mix-blend-mode: screen;
      background:
        radial-gradient(ellipse 42% 24% at 22% 32%, rgba(255,124,170,.60), transparent 70%),
        radial-gradient(ellipse 52% 26% at 78% 44%, rgba(92,216,255,.50), transparent 72%),
        radial-gradient(ellipse 46% 22% at 38% 78%, rgba(255,184,96,.44), transparent 72%),
        radial-gradient(ellipse 38% 20% at 68% 84%, rgba(178,138,255,.38), transparent 74%),
        linear-gradient(112deg, transparent 12%, rgba(255,140,190,.13) 28%, transparent 44%, rgba(100,220,255,.12) 60%, transparent 76%);
      animation: flow 6s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes drift {
      0%, 100% { transform: translate3d(-2.5%, -1.5%, 0) scale(1.08); }
      25% { transform: translate3d(0, -2.5%, 0) scale(1.12); }
      50% { transform: translate3d(2.5%, 1.5%, 0) scale(1.08); }
      75% { transform: translate3d(0, 2%, 0) scale(1.12); }
    }
    @keyframes flow {
      0%, 100% { transform: translate3d(-3%, 2%, 0) rotate(-1deg) scale(1.04); }
      25% { transform: translate3d(2%, -2%, 0) rotate(.7deg) scale(1.08); }
      50% { transform: translate3d(3%, 2%, 0) rotate(1deg) scale(1.04); }
      75% { transform: translate3d(-2%, -1.5%, 0) rotate(-.7deg) scale(1.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      .wallpaper, .lightflow { animation: none; }
    }
  </style>
</head>
<body aria-label="Turbolu canlı duvar kâğıdı">
  <div class="wallpaper" aria-hidden="true"></div>
  <div class="lightflow" aria-hidden="true"></div>
</body>
</html>
