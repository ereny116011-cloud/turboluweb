<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaydol - TurboluMC</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="mc/crpr.png" type="image/png">
    <link rel="stylesheet" href="mc/style.css?v=5">
    <link rel="stylesheet" href="site-polish.css?v=12">
</head>
<body>
    <div class="bg-image"></div>
    <div id="userArea" hidden></div>
    <main class="glass-card" style="width:min(92vw,400px); margin:clamp(24px,8vh,100px) auto; padding:clamp(20px,5vw,2rem);">
        <h2 style="text-align:center;">Kaydol</h2>
        <form id="registerForm" novalidate>
            <input id="username" name="username" placeholder="Kullanıcı adı" autocomplete="username"
                   maxlength="20" minlength="3" autocapitalize="none" autocorrect="off" spellcheck="false" required>
            <input id="email" name="email" type="email" placeholder="E-posta" autocomplete="email"
                   inputmode="email" autocapitalize="none" spellcheck="false" required>
            <input id="password" name="password" type="password" placeholder="Parola" autocomplete="new-password" required>
            <p id="formError" class="auth-error" role="alert" aria-live="polite"></p>
            <button class="btn-green" id="registerBtn" type="submit" style="width:100%;">Kaydol</button>
        </form>
        <div data-oauth-mount></div>
        <p style="text-align:center; margin-top:10px;"><a href="mc/giris.html">Giriş Yap</a></p>
    </main>
    <script>
        (function () {
            const API = 'https://shrill-salad-a498.ereny116011.workers.dev';
            const form = document.getElementById('registerForm');
            const error = document.getElementById('formError');
            const btn = document.getElementById('registerBtn');
            let busy = false;

            form.addEventListener('submit', async function (event) {
                event.preventDefault();
                if (busy) return;

                const username = document.getElementById('username').value.trim().replace(/\s+/g, ' ');
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                error.textContent = '';
                if ([...username].length < 3) { error.textContent = 'Kullanıcı adı en az 3 karakter olmalı.'; return; }
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { error.textContent = 'Geçerli bir e-posta adresi gir.'; return; }
                if (!password) { error.textContent = 'Parola gerekli.'; return; }

                busy = true;
                btn.disabled = true;
                btn.textContent = 'Kaydediliyor…';
                try {
                    const res = await fetch(API + '/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password, email })
                    });
                    const data = await res.json().catch(function () { return {}; });
                    if (!res.ok || data.error) {
                        error.textContent = data.error || 'Kayıt tamamlanamadı. Lütfen tekrar dene.';
                        return;
                    }
                    localStorage.setItem('token', data.token);
                    window.location.href = 'mc/index.html';
                } catch (_) {
                    error.textContent = 'Sunucuya ulaşılamadı. İnternet bağlantını kontrol et.';
                } finally {
                    busy = false;
                    btn.disabled = false;
                    btn.textContent = 'Kaydol';
                }
            });
        })();
    </script>
    <script src="/site-account.js?v=9"></script>
</body>
</html>
