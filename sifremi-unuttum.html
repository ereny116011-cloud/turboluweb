<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifremi Unuttum - TurboluMC</title>
    <link rel="icon" href="crpr.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-image"></div>
    <div class="glass-card" style="max-width:400px; margin:100px auto; padding:2rem;">
        <h2 style="text-align:center;">Şifremi Unuttum</h2>
        <input id="email" type="email" placeholder="E-posta adresiniz"><br>
        <button class="btn-green" style="width:100%;" onclick="sendReset()">Gönder</button>
        <p style="text-align:center; margin-top:10px;"><a href="giris.html">Giriş Yap</a></p>
    </div>
    <script>
        async function sendReset() {
            const email = document.getElementById('email').value.trim();
            const res = await fetch('https://shrill-salad-a498.ereny116011.workers.dev/api/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            alert(data.message || data.error);
        }
    </script>
</body>
</html>
