[package]
name = "turboluapp"
version = "1.0.0"
description = "Turbolu Studios masaüstü uygulaması"
authors = ["Turbolu Studios"]
license = "GPL-3.0-only"
repository = "https://github.com/ereny116011-cloud/turboluweb"
edition = "2021"
rust-version = "1.77"
# `cargo run` için varsayılan binary (sağlama toplamı aracı ayrı çalıştırılır).
default-run = "turboluapp"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native", "crypto-rust"] }
url = "2"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_WindowsAndMessaging"
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"

[features]
# `cargo tauri dev` sırasında `cargo watch` yeniden başlatma aracını kullanır.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
