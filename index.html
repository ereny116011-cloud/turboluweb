<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Turbolu Studios - Projelerimiz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-image"></div>

    <div class="portal-container">
        <header class="portal-header">
            <div class="portal-logo" onclick="window.location.href='/'">
                <svg width="40" height="40" viewBox="0 0 8 8">
                    <rect width="8" height="8" fill="#22c55e"/>
                    <rect x="1" y="1" width="2" height="2" fill="#000"/>
                    <rect x="5" y="1" width="2" height="2" fill="#000"/>
                    <rect x="2" y="4" width="4" height="1" fill="#000"/>
                    <rect x="1" y="5" width="6" height="1" fill="#000"/>
                    <rect x="0" y="6" width="8" height="1" fill="#000"/>
                </svg>
                Turbolu Studios
            </div>
            <p>Projelerimize göz atın!</p>
        </header>

        <div class="project-grid">
            <a href="/mc/" class="project-card">
                <div class="project-icon">
                    <svg width="60" height="60" viewBox="0 0 8 8">
                        <rect width="8" height="8" fill="#22c55e"/>
                        <rect x="1" y="1" width="2" height="2" fill="#000"/>
                        <rect x="5" y="1" width="2" height="2" fill="#000"/>
                        <rect x="2" y="4" width="4" height="1" fill="#000"/>
                        <rect x="1" y="5" width="6" height="1" fill="#000"/>
                        <rect x="0" y="6" width="8" height="1" fill="#000"/>
                    </svg>
                </div>
                <div class="project-info">
                    <h2>TurboluMC</h2>
                    <p>Minecraft Sunucumuz</p>
                    <span class="project-badge">Aktif</span>
                </div>
            </a>

            <a href="#" class="project-card future" onclick="alert('Yakında!'); return false;">
                <div class="project-icon">❓</div>
                <div class="project-info">
                    <h2>Yeni Proje</h2>
                    <p>Çok yakında...</p>
                    <span class="project-badge">Yakında</span>
                </div>
            </a>
        </div>

        <footer class="portal-footer">
            <p>&copy; 2026 Turbolu Studios. Tüm Hakları Saklıdır.</p>
        </footer>
    </div>
</body>
</html>
