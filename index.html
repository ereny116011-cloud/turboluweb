<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Turbolu Studios - Projelerimiz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-image"></div>

    <div class="portal-container">
        <!-- Üst Başlık -->
        <header class="portal-header">
            <h1><i class="fa-solid fa-cube"></i> Turbolu Studios</h1>
            <p>Projelerimize göz atın!</p>
        </header>

        <!-- Proje Kartları -->
        <div class="project-grid">
            <!-- TurboluMC Kartı -->
            <a href="/mc/" class="project-card" style="--accent: #22c55e;">
                <div class="project-icon">
                    <i class="fa-solid fa-gamepad"></i>
                </div>
                <div class="project-info">
                    <h2>TurboluMC</h2>
                    <p>Minecraft Sunucumuz - Hayatta kalma, ekonomi, mini oyunlar ve çok daha fazlası!</p>
                    <span class="project-badge">Aktif</span>
                </div>
            </a>

            <!-- Gelecek Proje Yeri (şablon) -->
            <a href="#" class="project-card future" style="--accent: #64748b;" onclick="alert('Yakında!'); return false;">
                <div class="project-icon">
                    <i class="fa-solid fa-question"></i>
                </div>
                <div class="project-info">
                    <h2>Yeni Proje</h2>
                    <p>Çok yakında...</p>
                    <span class="project-badge">Yakında</span>
                </div>
            </a>
        </div>

        <!-- Alt Bilgi -->
        <footer class="portal-footer">
            <p>&copy; 2026 Turbolu Studios. Tüm Hakları Saklıdır.</p>
        </footer>
    </div>
</body>
</html>
