<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Turbolu Studios - Projelerimiz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-image"></div>

    <div class="portal-container">
        <header class="portal-header">
            <div class="portal-logo" onclick="window.location.href='/'">
                <img src="mc/crpr.png" alt="Turbolu Studios" class="logo-img">
                Turbolu Studios
            </div>
            <p>Projelerimize göz atın!</p>
        </header>

        <div class="project-grid">
            <a href="/mc/" class="project-card">
                <div class="project-icon">
                    <img src="mc/crpr.png" alt="TurboluMC" class="project-icon-img">
                </div>
                <div class="project-info">
                    <h2>TurboluMC</h2>
                    <p>Minecraft Sunucumuz</p>
                    <span class="project-badge">Aktif</span>
                </div>
            </a>

            <a href="#" class="project-card future" onclick="alert('Yakında!'); return false;">
                <div class="project-icon">❓</div>
                <div class="project-info">
                    <h2>Yeni Proje</h2>
                    <p>Çok yakında...</p>
                    <span class="project-badge">Yakında</span>
                </div>
            </a>
        </div>

        <footer class="portal-footer">
            <p>&copy; 2026 Turbolu Studios. Tüm Hakları Saklıdır.</p>
        </footer>
    </div>
</body>
</html>
