<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbolu Bedrock - Bedrock Edition Minecraft Sunucusu</title>
    <meta name="description" content="Turbolu Bedrock, Bedrock Edition Minecraft sunucumuz. Telefon, tablet ve konsoldan katılın. Cross-play destekli.">
    
    <link rel="canonical" href="https://turboluweb.work.gd/bedrock/">
    
    <meta property="og:site_name" content="Turbolu Studios">
    <meta property="og:title" content="Turbolu Bedrock - Bedrock Edition Minecraft Sunucusu">
    <meta property="og:description" content="Telefon, tablet ve konsoldan katılın. Cross-play destekli Bedrock sunucumuz.">
    <meta property="og:url" content="https://turboluweb.work.gd/bedrock/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://turboluweb.work.gd/mc/crpr.webp">
    
    <link rel="icon" href="../mc/crpr.webp" type="image/webp">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="preload" as="font" type="font/woff2" href="../fa/webfonts/fa-solid-900.woff2" crossorigin>
    
    <link rel="stylesheet" href="../fa/css/fontawesome.min.css">
    <link rel="stylesheet" href="../fa/css/solid.min.css">
    <link rel="stylesheet" href="../mc/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#22c55e">
    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
            const isLight = saved ? saved === 'light' : prefersLight;
            if (isLight) document.documentElement.classList.add('light');
        })();
    </script>
</head>
<body>
    <canvas id="bgSteamCanvas" class="bg-steam-canvas" aria-hidden="true"></canvas>
    <div class="steam-container" aria-hidden="true">
        <div class="steam-blob blob-1"></div>
        <div class="steam-blob blob-2"></div>
        <div class="steam-blob blob-3"></div>
        <div class="steam-blob blob-4"></div>
        <div class="steam-blob blob-5"></div>
        <div class="steam-blob blob-6"></div>
        <div class="steam-blob blob-7"></div>
        <div class="steam-blob blob-8"></div>
    </div>

    <div id="app">
        <nav class="navbar">
            <div class="nav-left">
                <button class="back-btn" onclick="window.location.href='/'" aria-label="Geri">
                    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                </button>
                <div class="logo" onclick="showContent('status')">
                    <img src="../mc/crpr.webp" alt="Turbolu Bedrock" class="logo-img" width="32" height="32" loading="eager" fetchpriority="high" decoding="async">
                    Turbolu Bedrock
                </div>
            </div>
            <div class="nav-links" id="navLinks"></div>
            <div class="user-area" id="userArea"></div>
        </nav>
        <main id="content"></main>
        <div id="modal" class="modal hidden">
            <div class="modal-content" id="modalBody"></div>
        </div>
    </div>

    <button id="themeToggle" class="theme-toggle" title="Tema Değiştir" onclick="toggleTheme()" aria-label="Tema Değiştir">
        <i class="fa-solid fa-moon" aria-hidden="true"></i>
    </button>

    <canvas id="steamCanvas" class="steam-canvas" aria-hidden="true"></canvas>

    <script src="app.js"></script>
</body>
</html>
